[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amlwatch"
version = "0.1.0"
description = "Open-source anti-money-laundering transaction monitoring: explainable rules, anomaly scoring and synthetic test data."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rudy Sinon" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]
keywords = ["aml", "anti-money-laundering", "transaction-monitoring", "fintech", "compliance", "fraud", "anomaly-detection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
amlwatch = "amlwatch.cli:main"

[project.urls]
Homepage = "https://github.com/rsinon/amlwatch"
Issues = "https://github.com/rsinon/amlwatch/issues"

[tool.setuptools.packages.find]
include = ["amlwatch*"]

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
